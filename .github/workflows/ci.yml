# ============================================================
# YukiMart Frontend - CI Pipeline
# Runs on every push and PR to dev, staging, prod
# ============================================================
name: 🔍 CI - Build & Test

on:
  push:
    branches: [dev, staging, prod]
  pull_request:
    branches: [dev, staging, prod]

jobs:
  lint-and-build:
    name: 🧪 Lint & Build
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🔍 Lint check
        run: npm run lint --if-present
        continue-on-error: true

      - name: 🔍 Type check
        run: npm run type-check --if-present
        continue-on-error: true

      - name: 🏗️ Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: 📦 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7
