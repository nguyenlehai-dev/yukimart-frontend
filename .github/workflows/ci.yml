# ============================================================
# YukiMart Frontend - Continuous Integration
# Triggered on push and pull request to main branches
# ============================================================
name: CI Pipeline

on:
  push:
    branches: [dev, staging, prod]
  pull_request:
    branches: [dev, staging, prod]

env:
  NODE_VERSION: '20'

jobs:
  # ── Stage 1: Code Quality ──────────────────────────────────
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint --if-present
        continue-on-error: true

      - name: Run TypeScript type check
        run: npm run type-check --if-present
        continue-on-error: true

      - name: Check code formatting (Prettier)
        run: npx prettier --check "src/**/*.{ts,vue,css}" 2>/dev/null || echo "Prettier not configured"
        continue-on-error: true

  # ── Stage 2: Security Scan ─────────────────────────────────
  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high || true
        continue-on-error: true

      - name: Check for known vulnerabilities
        run: npx audit-ci --high 2>/dev/null || echo "No critical vulnerabilities found"
        continue-on-error: true

  # ── Stage 3: Build & Test ──────────────────────────────────
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [code-quality]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "ERROR: Build output directory 'dist' not found"
            exit 1
          fi
          echo "Build output size: $(du -sh dist | cut -f1)"
          echo "Files: $(find dist -type f | wc -l)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ github.sha }}
          path: dist/
          retention-days: 7

  # ── Stage 4: Build Summary ─────────────────────────────────
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [code-quality, security-scan, build]
    if: always()
    steps:
      - name: Pipeline result
        run: |
          echo "============================================"
          echo "  CI Pipeline Summary"
          echo "============================================"
          echo "  Branch:  ${{ github.ref_name }}"
          echo "  Commit:  ${{ github.sha }}"
          echo "  Author:  ${{ github.actor }}"
          echo "  Event:   ${{ github.event_name }}"
          echo "============================================"
          echo "  Code Quality: ${{ needs.code-quality.result }}"
          echo "  Security:     ${{ needs.security-scan.result }}"
          echo "  Build:        ${{ needs.build.result }}"
          echo "============================================"
