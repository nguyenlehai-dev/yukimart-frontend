# ============================================================
# YukiMart Frontend - Deploy to Staging (QA/Demo)
# Triggered on push to staging branch
# ============================================================
name: Deploy to Staging

on:
  push:
    branches: [staging]

env:
  NODE_VERSION: '20'

jobs:
  build:
    name: Build for Staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          NODE_ENV: staging
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://yukimart.io.vn/api' }}
      - run: test -d dist && echo "Build successful" || exit 1

  security-check:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=high || true

  deploy:
    name: Deploy to Staging Server
    runs-on: ubuntu-latest
    needs: [build, security-check]
    environment: staging
    steps:
      - name: Trigger deployment
        env:
          DEPLOY_WEBHOOK: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: |
          curl -s -X POST "$DEPLOY_WEBHOOK" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Secret: $DEPLOY_SECRET" \
            -d '{"repo":"yukimart-frontend","branch":"staging","env":"staging","commit":"'"$GITHUB_SHA"'"}'

  verify:
    name: Verify Staging
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - run: sleep 15
      - name: Health check
        run: curl -s -o /dev/null -w "Status: %{http_code}\n" --max-time 10 "https://yukimart.io.vn/" || true
        continue-on-error: true

  notify:
    name: Staging Report
    runs-on: ubuntu-latest
    needs: [build, security-check, deploy, verify]
    if: always()
    steps:
      - run: |
          echo "Staging Deploy: build=${{ needs.build.result }} security=${{ needs.security-check.result }} deploy=${{ needs.deploy.result }} verify=${{ needs.verify.result }}"
